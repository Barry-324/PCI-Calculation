<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柔性鋪面 PCI 計算</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ac:#1b5fd1}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e6e8ec;--mut:#9aa3b2;--bd:#343a45;--ac:#6ea1ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans TC",sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font-size:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 12px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 12px}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:center}
td:first-child{text-align:left}td input{width:100%;text-align:center}
.big{font-size:22px;font-weight:700}.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.wrap{overflow-x:auto}details{margin-top:8px}
</style></head><body>
<h1>柔性鋪面 PCI 計算</h1>
<div class="mut">依內政部柔性鋪面損壞調查手冊 / ASTM D6433-07。資料只在你的瀏覽器內計算，不會上傳。</div>
<div class="card"><div class="row"><div class="tabs" id="tabs"></div><button onclick="addS()">＋新增樣本</button></div></div>
<div class="card" id="sample"></div>
<div class="card"><b>路段 PCI</b>
 <div class="row" style="margin-top:6px"><label>路段總面積 (m²，有增列樣本時才需填)：<input id="secA" type="number" min="0" oninput="calcAll()"></label></div>
 <div id="sec" style="margin-top:8px"></div><button style="margin-top:10px" onclick="exportXlsx()">匯出 Excel</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const NAMES=["龜裂","縱向及橫向裂縫","塊狀裂縫","坑洞/人孔高差/薄層剝離","車轍","補綻回填","推擠","隆起凹陷","冒油","波浪鋪面","車道肩分離","滑溜裂縫","骨材剝落"];
const C={1:{L:[11.1,16.27,7.34,-1.45],M:[21.8,20.92,4.68,-.55],H:[31,27.17,6.46,-2.5]},
2:{L:[-1.7,4.45,5.18,0],M:[2.1,11.51,4.93,0],H:[8.3,14.06,12.96,0]},
3:{L:[0,9.19,-3.9,3.16],M:[2.2,8.98,5.67,0],H:[7.1,15.26,8.65,0]},
4:{L:[21.2,27.15,6.41,0],M:[31.4,40.77,14.14,0],H:[52.3,43.87,10.22,0]},
5:{L:[7.6,15.42,7.6,-2.29],M:[18.2,22.51,6.72,-2.75],H:[27.1,30.36,7.48,-3.34]},
6:{L:[2.1,8.06,6.15,0],M:[10,12.71,6.97,1.3],H:[19.4,22.44,0,9]},
7:{L:[4,12.06,4.21,0],M:[9.4,16.12,9.95,0],H:[18.8,23.88,11.25,-2.21]},
9:{L:[0,1.23,-.16,2.28],M:[3.2,4.33,3.02,1.99],H:[6.2,7.87,6.79,3.06]},
10:{L:[2,4.76,4.95,1],M:[15,17.16,6.25,0],H:[33.6,25.19,2.62,0]},
11:{L:[2.6,-4.38,6.85,0],M:[2.5,11.18,-16.41,10.79],H:[7.9,-12.86,19.84,0]},
12:{L:[5.3,14.51,8.09,-1.54],M:[11.6,23.63,11.29,-4.24],H:[20.5,37.5,14.78,-8.09]},
13:{X:[-14.8,39.71,-30.89,9.89]}};
// 第8類：手冊圖51數位化（目視讀值，約±2）
const T8={L:[[.333,0],[1,3],[3,6],[5,10],[10,16],[20,27],[30,35],[33.7,39]],
M:[[.333,5],[1,11.5],[3,22],[10,40],[20,59],[30,73],[33.7,79]],
H:[[.333,20],[1,32],[3,48.5],[10,71],[19,84.5],[33.7,99]]};
const MINX={2:{H:.31,M:.5,L:1.8},3:{M:.5,L:1},6:{L:.3},7:{L:.4},9:{L:1},11:{L:1.4,M:1.4,H:1.4},13:{X:2.2}};
const CAPX={6:50,7:50,11:50},CAPV={"6H":80};
const lg=Math.log10;const U=i=>i==2||i==11?"m":"m²";
function dv(i,l,x){
 if(!(x>=0.1))return 0;
 if(i==8){const t=T8[l];if(x<t[0][0])return 0;x=Math.min(x,t[t.length-1][0]);
  for(let k=0;k<t.length-1;k++)if(x<=t[k+1][0]){const[a,b]=t[k],[c,d]=t[k+1];return b+(lg(x)-lg(a))/(lg(c)-lg(a))*(d-b)}}
 const m=MINX[i]&&MINX[i][l];if(m&&x<m)return 0;
 if(CAPX[i])x=Math.min(x,CAPX[i]);
 const u=lg(x),p=C[i][l];let v=p[0]+p[1]*u+p[2]*u*u+p[3]*u**3;
 if(CAPV[i+l])v=Math.min(v,CAPV[i+l]);
 return Math.max(0,Math.min(v,100));}
const K={2:[-3.6,.91,-.0017],3:[-6.4,.82,-.0013],4:[-13,.86,-.0015],5:[-12,.76,-.0011],6:[-14.7,.75,-.0011],7:[-18.5,.86,-.0018]};
function cdv(dvs){
 const v=dvs.filter(d=>d>0).sort((a,b)=>b-a);if(!v.length)return{max:0,rows:[]};
 const m=Math.min(Math.ceil(1+9/98*(100-v[0])-1e-9),10);let l=v.slice(0,Math.min(m,7));
 const rows=[];let best=0;
 for(;;){const q=l.filter(d=>d>2).length,t=l.reduce((a,b)=>a+b,0);
  let c=q<=1?t:(k=>k[0]+k[1]*t+k[2]*t*t)(K[Math.min(q,7)]);c=Math.min(c,100);
  rows.push({l:[...l],t,q,c});best=Math.max(best,c);if(q<=1)break;
  let j=-1;l.forEach((d,n)=>{if(d>2)j=n});l[j]=2;l.sort((a,b)=>b-a);}
 return{max:Math.max(0,best),rows};}
function rate(p){for(const[t,n]of[[85,"最佳"],[70,"很好"],[55,"好"],[40,"尚可"],[25,"差"],[10,"很差"]])if(p>=t)return n;return"不合格"}
let S=[],cur=0;
function newS(){return{name:"",area:300,add:false,q:{}}}
const nm=i=>S[i].name.trim()||`樣本 ${i+1}`;
function setName(v){S[cur].name=v;document.querySelectorAll(".tab")[cur].textContent=nm(cur)+(S[cur].add?"*":"")}
function addS(){S.push(newS());cur=S.length-1;render()}
function delS(){if(S.length>1){S.splice(cur,1);cur=Math.max(0,cur-1);render()}}
function setQ(i,l,v){S[cur].q[i+l]=parseFloat(v)||0;calcAll()}
function pci(s){const rows=[],dvs=[];
 for(let i=1;i<=13;i++)for(const l of i==13?["X"]:["L","M","H"]){const q=s.q[i+l];
  if(q>0&&s.area>0){const x=q/s.area*100,d=dv(i,l,x);rows.push({i,l,q,x,d});dvs.push(d)}}
 const r=cdv(dvs);return{p:100-r.max,rows,steps:r.rows}}
function render(){
 document.getElementById("tabs").innerHTML=S.map((s,i)=>`<button class="tab ${i==cur?"on":""}" onclick="cur=${i};render()">${nm(i)}${s.add?"*":""}</button>`).join("");
 const s=S[cur];let h=`<div class="row"><label>樣本名稱：<input type="text" maxlength="20" value="${s.name.replace(/"/g,"&quot;")}" placeholder="樣本 ${cur+1}" oninput="setName(this.value)" style="width:150px"></label><label>樣本面積 (m²)：<input type="number" min="0" value="${s.area}" oninput="S[cur].area=parseFloat(this.value)||0;calcAll()" style="width:100px"></label>
 <label><input type="checkbox" ${s.add?"checked":""} onchange="S[cur].add=this.checked;render()"> 增列樣本（非代表性）</label><button onclick="delS()">刪除此樣本</button></div>
 <div class="wrap"><table><tr><th>損壞類型</th><th>Low</th><th>Med</th><th>High</th></tr>`;
 for(let i=1;i<=13;i++){const f=l=>`<input type="number" min="0" step="any" value="${s.q[i+l]||""}" placeholder="0" oninput="setQ(${i},'${l}',this.value)">`;
  h+=`<tr><td>${i}. ${NAMES[i-1]}（${U(i)}）</td>`+(i==13?`<td colspan="3">${f("X")}</td>`:`<td>${f("L")}</td><td>${f("M")}</td><td>${f("H")}</td>`)+"</tr>"}
 h+=`</table></div><div class="mut">數量單位依內政部手冊：縱橫裂縫、車道與路肩分離為長度（m），其餘皆為面積（m²）。第 4 類的坑洞、人孔高差、薄層剝離都以面積加總，填在同一欄。</div><div id="res"></div>`;
 document.getElementById("sample").innerHTML=h;calcAll()}
function calcAll(){
 const s=S[cur],r=pci(s),lv={L:"L",M:"M",H:"H",X:"-"};
 document.getElementById("res").innerHTML=`<p>樣本 PCI = <span class="big">${r.p.toFixed(1)}</span>（${rate(r.p)}）</p>
 <details><summary>計算明細</summary><div class="wrap"><table><tr><th>類型</th><th>數量</th><th>密度%</th><th>DV</th></tr>${r.rows.map(a=>`<tr><td>${a.i}${lv[a.l]} ${NAMES[a.i-1]}</td><td>${a.q}</td><td>${a.x.toFixed(2)}</td><td>${a.d.toFixed(1)}</td></tr>`).join("")}</table>
 <table style="margin-top:8px"><tr><th>修正輪次</th><th>折減值</th><th>Total</th><th>q</th><th>CDV</th></tr>${r.steps.map((a,n)=>`<tr><td>${n+1}</td><td>${a.l.map(v=>v.toFixed(1)).join(", ")}</td><td>${a.t.toFixed(1)}</td><td>${a.q}</td><td>${a.c.toFixed(1)}</td></tr>`).join("")}</table></div></details>`;
 const R=[],A=[];S.forEach(x=>{if(!(x.area>0))return;const p={p:pci(x).p,a:x.area};(x.add?A:R).push(p)});
 const w=u=>u.reduce((a,b)=>a+b.p*b.a,0)/u.reduce((a,b)=>a+b.a,0);
 let out="請至少輸入一個隨機樣本。";
 if(R.length){let pr=w(R);out=`隨機樣本 ${R.length} 個，面積加權 PCI = ${pr.toFixed(1)}<br>`;let f=pr;
  if(A.length){const pa=w(A),sa=A.reduce((a,b)=>a+b.a,0),T=parseFloat(document.getElementById("secA").value)||(R.reduce((a,b)=>a+b.a,0)+sa);
   f=(pr*(T-sa)+pa*sa)/T;out+=`增列樣本 ${A.length} 個，PCI = ${pa.toFixed(1)}<br>`}
  out+=`路段 PCI = <span class="big">${f.toFixed(1)}</span>（${rate(f)}）`}
 document.getElementById("sec").innerHTML=out}
function exportXlsx(){
 if(typeof XLSX==="undefined"){alert("Excel 元件載入失敗，請確認網路連線後重新整理頁面");return}
 const lv={L:"輕",M:"中",H:"重",X:"-"},R=[],A=[],sum=[["樣本","類型","面積(m²)","PCI","等級"]],sheets=[];
 S.forEach((x,i)=>{const r=pci(x);sum.push([nm(i),x.add?"增列":"隨機",x.area,+r.p.toFixed(1),rate(r.p)]);
  if(x.area>0)(x.add?A:R).push({p:r.p,a:x.area});
  const d=[["損壞類型","等級","數量","單位","密度(%)","DV"]];
  r.rows.forEach(a=>d.push([`${a.i}. ${NAMES[a.i-1]}`,lv[a.l],a.q,U(a.i),+a.x.toFixed(3),+a.d.toFixed(1)]));
  d.push([],["修正輪次","折減值","Total","q","CDV"]);
  r.steps.forEach((a,n)=>d.push([n+1,a.l.map(v=>v.toFixed(1)).join(", "),+a.t.toFixed(1),a.q,+a.c.toFixed(1)]));
  d.push([],["樣本 PCI",+r.p.toFixed(1),rate(r.p)]);let sn=nm(i).replace(/[:\\\/?*\[\]]/g,"_").slice(0,28)||`樣本${i+1}`;while(sheets.some(z=>z[0]===sn))sn=sn.slice(0,26)+"_"+(i+1);sheets.push([sn,d])});
 if(R.length){const w=u=>u.reduce((a,b)=>a+b.p*b.a,0)/u.reduce((a,b)=>a+b.a,0);let f=w(R);
  if(A.length){const sa=A.reduce((a,b)=>a+b.a,0),T=parseFloat(document.getElementById("secA").value)||(R.reduce((a,b)=>a+b.a,0)+sa);f=(f*(T-sa)+w(A)*sa)/T}
  sum.push([],["路段 PCI",+f.toFixed(1),rate(f)])}
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"摘要");
 sheets.forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),n));
 XLSX.writeFile(wb,"PCI計算結果.xlsx")}
addS();
</script></body></html>
